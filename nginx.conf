server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão dos textos (JS, CSS, JSON, SVG)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Usado pelo teste de saúde do Docker/Easypanel
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Arquivos gerados pelo build têm o hash no nome: podem ficar em cache por 1 ano.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Fotos dos produtos e logo: cache de 30 dias. Arquivo que não existe dá 404 (não volta a página inicial).
  location ~ ^/(produtos/|logo-budega\.webp$|logo\.svg$) {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # A página inicial nunca fica em cache, para uma nova versão aparecer logo.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # O site é uma página única: endereços como /login e /gestao-pedidos voltam para o index.html,
  # e quem decide o que mostrar é o próprio site.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
  }
}
